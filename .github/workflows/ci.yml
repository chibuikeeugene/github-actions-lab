name: Python CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: run python tests
        runs-on: ubuntu-latest

        steps:
            - name: check out repository
              uses: actions/checkout@v7

            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: "3.13"
                cache: pip

            - name: install dependencies
              run: |
                    pip install --upgrade pip
                    pip install -r requirements.txt

            - name: run test
              run:
                    pytest
