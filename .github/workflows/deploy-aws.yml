name: Deploy to AWS ECS

on:
    release:
        types: published

permissions:
    contents: read

env:
    AWS_REGION: ${{vars.AWS_REGION}}
    AWS_ROLE_ARN: ${{vars.AWS_ROLE_ARN}}
    ECR_REPOSITORY: ${{vars.ECR_REPOSITORY}}
    ECS_CLUSTER: ${{vars.ECS_CLUSTER}}
    ECS_CONTAINER_NAME: ${{vars.ECS_CONTAINER_NAME}}
    ECS_SERVICE: ${{vars.ECS_SERVICE}}
    ECS_TASK_DEFINITION: ${{vars.ECS_TASK_DEFINITION}}

jobs:
    deploy:
        name: Deploy to ECS
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        permissions:
            contents: read
            id-token: write
        steps:
            - name: checkout repository
              uses: actions/checkout@v7

            - name: Authenticate to AWS with OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{vars.AWS_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}
                role-session-name: github-actions-ecs-deploy

            - name: Verify AWS caller identity
              run: aws sts get-caller-identity
            
            - name: Login to Amazon ECR 
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push docker image
              id: build-image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

                docker build \
                    --tag "$IMAGE_URI" \
                    .

                docker push "$IMAGE_URI"

                echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

            - name: Render ECS task definition
              id: task-definition
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                task-definition: ${{ env.ECS_TASK_DEFINITION }}
                container-name: ${{ env.ECS_CONTAINER_NAME }}
                image: ${{ steps.build-image.outputs.image }}

            - name: Deploy ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.task-definition.outputs.task-definition }}
                service: ${{ env.ECS_SERVICE }}
                cluster: ${{ env.ECS_CLUSTER }}
                wait-for-service-stability: true
            
            - name: Verify deployed application # post deployment smoke test
              env:
                APPLICATION_URL: ${{ vars.APPLICATION_URL }}
              run: |
                python - <<'PY'
                import os
                import sys
                import time
                import urllib.error
                import urllib.request

                application_url = os.getenv("APPLICATION_URL")
                health_url = f"{application_url}/health"

                for attempt in range(1, 16):
                    try:
                        with urllib.request.urlopen(health_url, timeout=10) as response:
                            if 200 <= response.status < 300:
                                print("Application is healthy.")
                                sys.exit(0)

                    except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError):
                        pass

                    print(f"Waiting for application... attempt {attempt}/15")
                    time.sleep(10)

                print("Post-deployment health check failed.")
                sys.exit(1)
                PY

            - name: Verify calculator endpoint # test actual business behavoir with a single endpoint
              env:
                APPLICATION_URL: ${{ vars.APPLICATION_URL }}
              run: |
                python - <<'PY'
                import json
                import os
                import sys
                import urllib.request

                application_url = os.getenv("APPLICATION_URL")
                url = f"{application_url}/add?a=2&b=3"

                try:
                    with urllib.request.urlopen(url, timeout=10) as response:
                        body = response.read().decode()
                        print(body)

                        data = json.loads(body)

                        if data.get("result") != 5.0:
                            print("Unexpected calculator result.")
                            sys.exit(1)

                except Exception as error:
                    print(f"Calculator endpoint verification failed: {error}")
                    sys.exit(1)
                PY

